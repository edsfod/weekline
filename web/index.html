<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周时间轴</title>
<!-- 配色变量与显示设置面板来自 web-kit（/kit/*，由服务从 web-kit/schemes.json 生成）；kit.js 放在 head 里，页面画出前就施加配色 -->
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/app.css">
<script src="/kit/kit.js" data-prefix="weekline"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-file" viewBox="0 0 14 16"><path d="M2 1.5h6.5L12.5 5.5V14.5H2z"/><path d="M8.5 1.5v4h4"/></symbol>
  <symbol id="i-undo" viewBox="0 0 14 14"><path d="M4 2 1.5 4.5 4 7"/><path d="M1.5 4.5h7a4 4 0 0 1 0 8H5"/></symbol>
  <symbol id="i-redo" viewBox="0 0 14 14"><path d="M10 2l2.5 2.5L10 7"/><path d="M12.5 4.5h-7a4 4 0 0 0 0 8H9"/></symbol>
  <symbol id="i-panel" viewBox="0 0 14 14"><rect x="1.5" y="1.5" width="11" height="11" rx="1.5"/><path d="M8.5 1.5v11"/></symbol>
  <symbol id="i-lock" viewBox="0 0 14 16"><rect x="1.5" y="7" width="11" height="7.5" rx="1.5"/><path d="M4 7V4.5a3 3 0 0 1 6 0V7"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 1.8 15 14.2H1z"/><path d="M8 6.2v3.8M8 11.8v.4"/></symbol>
  <symbol id="i-more" viewBox="0 0 14 4"><circle cx="2" cy="2" r="1.4" fill="currentColor" stroke="none"/><circle cx="7" cy="2" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="2" r="1.4" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
</svg>

<header class="topbar">
  <label class="sr-only" for="title">标题</label>
  <input id="title" class="title-input" maxlength="100" spellcheck="false" autocomplete="off">
  <div class="fileinfo">
    <button id="fileName" class="filebtn" type="button" title="计划文件">
      <svg class="ico" aria-hidden="true"><use href="#i-file"/></svg><span class="mono">plan.md</span>
    </button>
    <span id="saveState" class="savestate" role="status" aria-live="polite"></span>
  </div>
  <nav class="tabs" aria-label="页面">
    <button id="tabTpl" class="tab" type="button" aria-pressed="true" title="Alt+1">模板</button>
    <button id="tabDays" class="tab" type="button" aria-pressed="false" title="Alt+2">日程</button>
  </nav>
  <div class="spacer"></div>
  <nav class="actions" aria-label="文件与编辑">
    <button id="btnImport" class="btn" type="button" title="读入一个 md 文件，替换当前内容（可以撤销）">导入</button>
    <button id="btnExport" class="btn" type="button" title="下载当前内容的 md 文件">导出</button>
    <div class="sep"></div>
    <button id="btnUndo" class="btn" type="button" title="Ctrl+Z"><svg class="ico" aria-hidden="true"><use href="#i-undo"/></svg>撤销</button>
    <button id="btnRedo" class="btn" type="button" title="Ctrl+Y 或 Ctrl+Shift+Z"><svg class="ico" aria-hidden="true"><use href="#i-redo"/></svg>重做</button>
    <div class="sep"></div>
    <button id="btnTv" class="btn" type="button" aria-pressed="false"><svg class="ico" aria-hidden="true"><use href="#i-panel"/></svg>文本视图</button>
    <button id="btnSettings" class="btn" type="button">文档设置</button>
    <button id="btnHelp" class="btn btn-ghost" type="button" title="快捷键与图例（在编辑区按 ?）">快捷键</button>
    <button id="settings" class="btn btn-ghost icon" type="button" aria-label="显示设置" title="显示设置：配色、英文字体、粗细、灰字亮度"><svg class="ico lg" aria-hidden="true"><use href="#i-sliders"/></svg></button>
    <button id="theme" class="btn btn-ghost icon" type="button" aria-label="切换深浅色" title="切换深浅色（象牙↔暖炭，青瓷↔深青）"><svg class="ico lg" aria-hidden="true"><use href="#i-sun"/></svg></button>
  </nav>
</header>

<div class="workspace">
  <main class="main">
    <div id="diskBanner" class="banner" hidden>
      <svg class="ico" aria-hidden="true"><use href="#i-warn"/></svg>
      <span id="diskText"></span>
      <span class="spacer"></span>
      <button id="diskLoad" class="btn" type="button">载入文件的版本</button>
      <button id="diskOverwrite" class="btn" type="button">用本页的内容覆盖文件</button>
      <button id="diskRetry" class="btn" type="button">立即重试</button>
    </div>

    <div id="banner" class="banner" hidden>
      <svg class="ico" aria-hidden="true"><use href="#i-lock"/></svg>
      <span id="bannerText"><strong>只读</strong>：文本视图有未应用的修改。编辑区、笔记和标题暂不可编辑，在文本视图中点击“应用”或“放弃修改”后恢复。</span>
      <span class="spacer"></span>
      <button id="bannerTv" class="btn" type="button">显示文本视图</button>
    </div>

    <div id="pagebar" class="pagebar"></div>

    <section id="editor" class="editor" tabindex="0" aria-label="编辑区。方向键选择格，E 或 S 设为区间，Alt+1、Alt+2 切换模板页与日程页，按问号查看全部快捷键" aria-describedby="selDesc">
      <div id="grid" class="grid">
        <div id="rows"></div>
        <input id="editInput" class="edit-input" hidden aria-label="区间文字，Enter 确认，Esc 取消" autocomplete="off" spellcheck="false">
      </div>
    </section>

    <div class="statusbar">
      <span id="selKind" class="badge">无选区</span>
      <span id="selDesc" class="mono"></span>
      <span class="spacer"></span>
      <span id="msg" role="status" aria-live="polite"></span>
      <span id="zoomHint" class="zoomhint" hidden></span>
    </div>

  </main>

  <aside id="tvPanel" class="tvpanel" hidden aria-label="文本视图">
    <div class="tv-head">
      <strong>文本视图</strong>
      <span id="tvState" class="pill warn dashed" hidden>有未应用修改</span>
    </div>
    <div class="tv-box">
      <div id="tvGutter" class="tv-gutter" aria-hidden="true"></div>
      <textarea id="tvText" wrap="off" spellcheck="false" aria-label="md 文本"></textarea>
    </div>
    <div id="tvErrors" class="tv-errors" hidden></div>
    <div class="tv-actions">
      <button id="tvApply" class="btn soft" type="button">应用</button>
      <button id="tvDiscard" class="btn" type="button">放弃修改</button>
      <span class="spacer"></span>
      <button id="tvCopy" class="btn" type="button">复制</button>
    </div>
  </aside>
</div>

<div id="menu" class="menu" role="menu" hidden></div>
<dialog id="dlg"><div class="dlg"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><p id="dlgErr" class="dlg-err" hidden></p><div id="dlgBtns" class="dlg-btns"></div></div></dialog>
<input id="fileInput" type="file" accept=".md,.txt,text/markdown,text/plain" hidden>

<!-- 纯函数层，然后是界面层（顺序固定：后面的文件可以直接取用前面文件挂到 WeekApp 上的函数） -->
<script src="/core.js"></script>
<script src="/app/base.js"></script>
<script src="/app/state.js"></script>
<script src="/app/page.js"></script>
<script src="/app/render.js"></script>
<script src="/app/textview.js"></script>
<script src="/app/edit.js"></script>
<script src="/app/input.js"></script>
<script src="/app/menus.js"></script>
<script src="/app/files.js"></script>
<script src="/app/main.js"></script>
</body>
</html>
